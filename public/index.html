<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HRMS AI Agent</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
        }

        body {
            margin: 0;
        }

        main {
            max-width: 880px;
            margin: 0 auto;
            padding: 24px;
        }

        section {
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 16px;
        }

        h2 {
            font-size: 16px;
            margin: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin: 12px 0 6px;
        }

        input,
        textarea,
        button {
            box-sizing: border-box;
            width: 100%;
            font: inherit;
            border-radius: 6px;
        }

        input,
        textarea {
            border: 1px solid #bcccdc;
            padding: 10px;
        }

        textarea {
            min-height: 88px;
            resize: vertical;
        }

        button {
            border: 0;
            background: #0b7285;
            color: #ffffff;
            padding: 10px 14px;
            margin-top: 12px;
            cursor: pointer;
        }

        button.secondary {
            background: #52606d;
        }

        button.compact {
            margin-top: 0;
            padding: 8px 12px;
            width: auto;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .busy {
            align-items: center;
            color: #52606d;
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .dots::after {
            animation: dots 1.2s steps(4, end) infinite;
            content: "";
            display: inline-block;
            width: 30px;
            font-weight: bolder;
            margin-top: 4px;
        }

        @keyframes dots {
            0% {
                content: "";
            }
            25% {
                content: ".";
            }
            50% {
                content: "..";
            }
            75%,
            100% {
                content: "...";
            }
        }

        .hidden {
            display: none;
        }

        .messages {
            min-height: 260px;
            max-height: 420px;
            overflow: auto;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 12px;
            background: #fbfcfd;
        }

        .message {
            white-space: pre-wrap;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .user {
            background: #d9f0f4;
        }

        .agent {
            background: #edf2f7;
        }

        .meta {
            color: #52606d;
            font-size: 13px;
        }

        .chatHeader {
            align-items: center;
            display: flex;
            gap: 12px;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .messages {
            min-height: 260px;
            max-height: 420px;
            overflow: auto;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 12px;
            background: #fbfcfd;
            position: relative;
        }

        .busy {
            align-items: center;
            background: rgba(11, 114, 133, 0.08);
            border-radius: 8px;
            color: #52606d;
            display: flex;
            gap: 8px;
            padding: 5px 10px;
            position: absolute;
            left: 12px;
            bottom: 12px;
            width: fit-content;
            z-index: 2;
        }

        #chatSection {
            position: relative;
        }
    </style>
</head>
<body>
    <main>
        <h1>HRMS AI Agent</h1>

        <section id="loginSection">
            <h2>Login</h2>
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password">
            <button id="loginButton">Login</button>
            <p id="loginStatus" class="meta"></p>
        </section>

        <section id="chatSection" class="hidden">
            <div class="chatHeader">
                <h2>Chat</h2>
                <button id="logoutButton" class="secondary compact">Logout</button>
            </div>
            <p id="userInfo" class="meta"></p>
            <div id="messages" class="messages">
                <div id="busyIndicator" class="busy hidden"><span class="dots"></span></div>
            </div>
            <label for="message">Message</label>
            <textarea id="message" placeholder=""></textarea>
            <button id="sendButton" disabled>Send</button>
            <button id="resetButton" class="secondary">Reset Chat</button>
        </section>
    </main>

    <script>
        const loginSection = document.getElementById("loginSection");
        const chatSection = document.getElementById("chatSection");
        const loginStatus = document.getElementById("loginStatus");
        const userInfo = document.getElementById("userInfo");
        const messages = document.getElementById("messages");
        const messageInput = document.getElementById("message");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const sendButton = document.getElementById("sendButton");
        const resetButton = document.getElementById("resetButton");
        const logoutButton = document.getElementById("logoutButton");
        const busyIndicator = document.getElementById("busyIndicator");
        const defaultPlaceholder = messageInput.placeholder;
        let busyTimer = null;

        let sessionId = localStorage.getItem("hrmsSessionId");

        function addMessage(text, type) {
            const node = document.createElement("div");
            node.className = `message ${type}`;
            node.textContent = text;
            messages.appendChild(node);
            messages.scrollTop = messages.scrollHeight;
        }

        function showChat(user) {
            loginSection.classList.add("hidden");
            chatSection.classList.remove("hidden");
            userInfo.textContent = user
                ? `${user.userName || user.email || "Logged in"} | ${user.empId || ""} | ${user.userRole || ""}`
                : "Logged in";
            messageInput.placeholder = user
                ? `Hi ${user.userName || user.email || "there"}, how can I help you today?`
                : defaultPlaceholder;
            updateSendButtonState();
            busyIndicator.style.display = "none";
        }

        function showLogin() {
            chatSection.classList.add("hidden");
            loginSection.classList.remove("hidden");
            Array.from(messages.querySelectorAll(".message")).forEach((node) => node.remove());
            userInfo.textContent = "";
            loginStatus.textContent = "";
            messageInput.placeholder = defaultPlaceholder;
            busyIndicator.style.display = "none";
        }

        function clearLocalSession(message) {
            sessionId = null;
            localStorage.removeItem("hrmsSessionId");
            showLogin();
            loginStatus.textContent = message || "Please login again.";
        }

        async function login() {
            loginStatus.textContent = "Logging in...";
            setLoginBusy(true);

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: emailInput.value,
                        password: passwordInput.value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    loginStatus.textContent = data.error || "Login failed";
                    return;
                }

                sessionId = data.sessionId;
                localStorage.setItem("hrmsSessionId", sessionId);
                showChat(data.user);
            } catch (error) {
                loginStatus.textContent = "Unable to login. Please try again.";
            } finally {
                setLoginBusy(false);
            }
        }

        async function sendMessage(text) {
            addMessage(text, "user");
            messageInput.value = "";
            setBusy(true);

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Session-Id": sessionId || ""
                    },
                    body: JSON.stringify({
                        sessionId,
                        message: text
                    })
                });

                const data = await response.json();

                if (response.status === 401) {
                    clearLocalSession(data.error);
                    return;
                }

                addMessage(data.message || data.error || "No response", "agent");
            } catch (error) {
                addMessage("Unable to reach HRMS AI. Please try again.", "agent");
            } finally {
                setBusy(false);
            }
        }

        function setLoginBusy(isBusy) {
            emailInput.disabled = isBusy;
            passwordInput.disabled = isBusy;
            loginButton.disabled = isBusy;
        }

        function updateSendButtonState() {
            sendButton.disabled = !messageInput.value.trim();
        }

        function setBusy(isBusy) {
            sendButton.disabled = isBusy || !messageInput.value.trim();
            resetButton.disabled = isBusy;
            logoutButton.disabled = isBusy;
            messageInput.disabled = isBusy;

            if (busyTimer) {
                clearTimeout(busyTimer);
                busyTimer = null;
            }

            if (isBusy) {
                busyTimer = setTimeout(() => {
                    busyIndicator.style.display = "flex";
                }, 100);
            } else {
                busyIndicator.style.display = "none";
            }
        }

        async function logout() {
            const activeSessionId = sessionId;

            sessionId = null;
            localStorage.removeItem("hrmsSessionId");

            if (activeSessionId) {
                await fetch("/logout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Session-Id": activeSessionId
                    },
                    body: JSON.stringify({
                        sessionId: activeSessionId
                    })
                });
            }

            showLogin();
        }

        function restoreSession() {
            if (!sessionId) {
                return;
            }

            fetch("/me", {
                headers: {
                    "X-Session-Id": sessionId
                }
            })
                .then(async (response) => {
                    const data = await response.json().catch(() => null);

                    if (!response.ok) {
                        clearLocalSession(data?.error);
                        return;
                    }

                    if (data?.user) {
                        showChat(data.user);
                    }
                });
        }

        loginButton.addEventListener("click", login);
        messageInput.addEventListener("input", updateSendButtonState);
        sendButton.addEventListener("click", () => {
            const text = messageInput.value.trim();

            if (text) {
                sendMessage(text);
            }
        });
        resetButton.addEventListener("click", () => {
            sendMessage("reset");
        });
        logoutButton.addEventListener("click", logout);

        restoreSession();
    </script>
</body>
</html>
