<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
        }

        body {
            margin: 0;
        }

        main {
            max-width: 880px;
            margin: 0 auto;
            padding: 24px;
        }

        section {
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 16px;
        }

        h2 {
            font-size: 16px;
            margin: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin: 12px 0 6px;
        }

        input,
        textarea,
        button {
            box-sizing: border-box;
            font: inherit;
            border-radius: 6px;
        }

        input,
        textarea {
            border: 1px solid #bcccdc;
            padding: 10px;
        }

        textarea {
            width: 100%;
            min-height: 88px;
            resize: none;
            overflow-y: auto;
        }

        button {
            border: 0;
            background: #0b7285;
            color: #ffffff;
            padding: 10px 14px;
            margin-top: 12px;
            cursor: pointer;
        }

        button.secondary {
            background: #52606d;
        }

        button.compact {
            margin-top: 0;
            padding: 8px 12px;
            width: auto;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .busy {
            align-items: center;
            color: #52606d;
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .dots::after {
            animation: dots 1.2s steps(4, end) infinite;
            content: "";
            display: inline-block;
            width: 30px;
            font-weight: bolder;
            margin-top: 4px;
        }

        @keyframes dots {
            0% {
                content: "";
            }

            25% {
                content: ".";
            }

            50% {
                content: "..";
            }

            75%,
            100% {
                content: "...";
            }
        }

        .hidden {
            display: none;
        }

        .message {
            white-space: pre-wrap;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .user {
            background: #d9f0f4;
        }

        .agent {
            background: #edf2f7;
        }

        .meta {
            color: #52606d;
            font-size: 13px;
        }

        .chatHeader {
            align-items: center;
            display: flex;
            gap: 12px;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .messages {
            height: 30em;
            max-height: 30em;
            overflow-y: auto;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 12px;
            background: #fbfcfd;
            position: relative;
        }

        .inputWrapper {
            position: relative;
            width: 100%;
        }

        .slash-menu {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            width: fit-content;
            min-width: 190px;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
            padding: 4px 0;
            z-index: 20;
        }

        .slash-menu.hidden {
            display: none;
        }

        .slash-menu button {
            width: 100%;
            text-align: left;
            padding: 8px 10px;
            border: none;
            background: transparent;
            color: #102a43;
            cursor: pointer;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .slash-menu button:hover,
        .slash-menu button.active {
            background: #e8f1ff;
        }

        .slash-menu button.active {
            color: #0f172a;
        }

        .busy {
            align-items: center;
            background: rgba(11, 114, 133, 0.08);
            border-radius: 8px;
            color: #52606d;
            display: flex;
            gap: 8px;
            padding: 5px 10px;
            position: absolute;
            left: 12px;
            bottom: 12px;
            width: fit-content;
            z-index: 2;
        }

        #chatSection {
            position: relative;
        }
    </style>
</head>

<body>
    <main>
        <section id="loginSection">
            <h2>Login</h2>
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" />
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" />
            <button id="loginButton">Login</button>
            <p id="loginStatus" class="meta"></p>
        </section>

        <section id="chatSection" class="hidden">
            <div class="chatHeader">
                <h2>Chat | HRMS AI Agent</h2>
                <button id="logoutButton" class="secondary compact">Logout</button>
            </div>
            <p id="userInfo" class="meta"></p>
            <div id="messages" class="messages">
                <div id="busyIndicator" class="busy hidden">
                    <span class="dots"></span>
                </div>
            </div>
            <label for="message">Message</label>
            <div class="inputWrapper">
                <textarea id="message" placeholder=""></textarea>
                <div id="slashMenu" class="slash-menu hidden"></div>
            </div>
        </section>
    </main>

    <script>
        const loginSection = document.getElementById("loginSection");
        const chatSection = document.getElementById("chatSection");
        const loginStatus = document.getElementById("loginStatus");
        const userInfo = document.getElementById("userInfo");
        const messages = document.getElementById("messages");
        const messageInput = document.getElementById("message");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const logoutButton = document.getElementById("logoutButton");
        const busyIndicator = document.getElementById("busyIndicator");
        const slashMenu = document.getElementById("slashMenu");
        const defaultPlaceholder = messageInput.placeholder;
        const slashModules = ["leave", "wfh", "projects", "holidays", "payroll", "attendance", "benefits", "directory", "policies"];
        let busyTimer = null;
        let selectedSlashIndex = -1;

        let sessionId = localStorage.getItem("hrmsSessionId");

        function addMessage(text, type) {
            const node = document.createElement("div");
            node.className = `message ${type}`;
            node.textContent = text;
            messages.appendChild(node);
            messages.scrollTop = messages.scrollHeight;
        }

        function showChat(user) {
            loginSection.classList.add("hidden");
            chatSection.classList.remove("hidden");
            userInfo.textContent = user
                ? `${user.userName || user.email || "Logged in"} | ${user.empId || ""} | ${user.userRole || ""}`
                : "Logged in";
            messageInput.placeholder = user
                ? `Hi ${user.userName || user.email || "there"}, how can I help you today?`
                : defaultPlaceholder;
            closeSlashMenu();
            busyIndicator.style.display = "none";
        }

        function showLogin() {
            chatSection.classList.add("hidden");
            loginSection.classList.remove("hidden");
            Array.from(messages.querySelectorAll(".message")).forEach((node) =>
                node.remove(),
            );
            userInfo.textContent = "";
            loginStatus.textContent = "";
            messageInput.placeholder = defaultPlaceholder;
            busyIndicator.style.display = "none";
        }

        function clearLocalSession(message) {
            sessionId = null;
            localStorage.removeItem("hrmsSessionId");
            showLogin();
            loginStatus.textContent = message || "Please login again.";
        }

        async function login() {
            loginStatus.textContent = "Logging in...";
            setLoginBusy(true);

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        email: emailInput.value,
                        password: passwordInput.value,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    loginStatus.textContent = data.error || "Login failed";
                    return;
                }

                sessionId = data.sessionId;
                localStorage.setItem("hrmsSessionId", sessionId);
                showChat(data.user);
            } catch (error) {
                loginStatus.textContent = "Unable to login. Please try again.";
            } finally {
                setLoginBusy(false);
            }
        }

        async function sendMessage(text) {
            addMessage(text, "user");
            messageInput.value = "";
            setBusy(true);

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Session-Id": sessionId || "",
                    },
                    body: JSON.stringify({
                        sessionId,
                        message: text,
                    }),
                });

                const data = await response.json();

                if (response.status === 401) {
                    clearLocalSession(data.error);
                    return;
                }

                addMessage(data.message || data.error || "No response", "agent");
            } catch (error) {
                addMessage("Unable to reach HRMS AI. Please try again.", "agent");
            } finally {
                setBusy(false);
            }
        }

        function setLoginBusy(isBusy) {
            emailInput.disabled = isBusy;
            passwordInput.disabled = isBusy;
            loginButton.disabled = isBusy;
        }

        function getSlashQuery() {
            const cursor = messageInput.selectionStart;
            const textBefore = messageInput.value.slice(0, cursor);
            const match = /(?:^|\s)(\/[^\s]*)$/.exec(textBefore);
            return match ? match[1] : null;
        }

        function renderSlashMenu() {
            const query = getSlashQuery();
            if (!query) {
                closeSlashMenu();
                return;
            }

            const filter = query.slice(1).toLowerCase();
            const candidates = slashModules.filter((module) =>
                module.startsWith(filter),
            );
            if (!candidates.length) {
                closeSlashMenu();
                return;
            }

            selectedSlashIndex = Math.min(
                selectedSlashIndex,
                candidates.length - 1,
            );
            if (selectedSlashIndex < 0) {
                selectedSlashIndex = 0;
            }

            slashMenu.innerHTML = "";
            candidates.forEach((module, index) => {
                const item = document.createElement("button");
                item.type = "button";
                item.textContent = module;
                item.className = index === selectedSlashIndex ? "active" : "";
                item.addEventListener("click", () => {
                    selectSlashModule(module);
                });
                slashMenu.appendChild(item);
            });

            slashMenu.classList.remove("hidden");
        }

        function selectSlashModule(module) {
            const cursor = messageInput.selectionStart;
            const textBefore = messageInput.value.slice(0, cursor);
            const textAfter = messageInput.value.slice(cursor);
            const match = /(?:^|\s)(\/[^\s]*)$/.exec(textBefore);
            if (!match) {
                return;
            }

            const prefix = textBefore.slice(0, match.index);
            const insertion = module + " ";
            messageInput.value = prefix + insertion + textAfter;
            messageInput.focus();
            const newCursor = prefix.length + insertion.length;
            messageInput.setSelectionRange(newCursor, newCursor);
            closeSlashMenu();
        }

        function closeSlashMenu() {
            selectedSlashIndex = -1;
            slashMenu.innerHTML = "";
            slashMenu.classList.add("hidden");
        }

        function handleMessageInput() {
            renderSlashMenu();
        }

        function setBusy(isBusy) {
            logoutButton.disabled = isBusy;
            messageInput.disabled = isBusy;

            if (busyTimer) {
                clearTimeout(busyTimer);
                busyTimer = null;
            }

            if (isBusy) {
                busyTimer = setTimeout(() => {
                    busyIndicator.style.display = "flex";
                }, 100);
            } else {
                busyIndicator.style.display = "none";
            }
        }

        async function logout() {
            const activeSessionId = sessionId;

            sessionId = null;
            localStorage.removeItem("hrmsSessionId");

            if (activeSessionId) {
                await fetch("/logout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Session-Id": activeSessionId,
                    },
                    body: JSON.stringify({
                        sessionId: activeSessionId,
                    }),
                });
            }

            showLogin();
        }

        function restoreSession() {
            if (!sessionId) {
                return;
            }

            fetch("/me", {
                headers: {
                    "X-Session-Id": sessionId,
                },
            }).then(async (response) => {
                const data = await response.json().catch(() => null);

                if (!response.ok) {
                    clearLocalSession(data?.error);
                    return;
                }

                if (data?.user) {
                    showChat(data.user);
                }
            });
        }

        loginButton.addEventListener("click", login);
        messageInput.addEventListener("input", handleMessageInput);
        messageInput.addEventListener("keydown", (event) => {
            if (slashMenu.classList.contains("hidden")) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    const text = messageInput.value.trim();
                    if (text) {
                        sendMessage(text);
                    }
                }
                return;
            }

            const buttons = Array.from(slashMenu.querySelectorAll("button"));
            if (event.key === "ArrowDown") {
                event.preventDefault();
                selectedSlashIndex = (selectedSlashIndex + 1) % buttons.length;
                buttons.forEach((button, index) =>
                    button.classList.toggle("active", index === selectedSlashIndex),
                );
                buttons[selectedSlashIndex]?.scrollIntoView({ block: "nearest" });
                return;
            }
            if (event.key === "ArrowUp") {
                event.preventDefault();
                selectedSlashIndex =
                    (selectedSlashIndex - 1 + buttons.length) % buttons.length;
                buttons.forEach((button, index) =>
                    button.classList.toggle("active", index === selectedSlashIndex),
                );
                buttons[selectedSlashIndex]?.scrollIntoView({ block: "nearest" });
                return;
            }
            if (event.key === "Enter") {
                event.preventDefault();
                if (selectedSlashIndex >= 0 && buttons.length) {
                    buttons[selectedSlashIndex].click();
                } else {
                    const text = messageInput.value.trim();
                    if (text) {
                        sendMessage(text);
                    }
                }
                return;
            }
            if (event.key === "Escape") {
                closeSlashMenu();
                return;
            }
        });
        logoutButton.addEventListener("click", logout);

        restoreSession();
    </script>
</body>

</html>
